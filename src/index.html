<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body { padding: 0; margin: 0; background: transparent; font-family: system-ui, sans-serif; }

    #player {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #now-playing {
      font-size: 11px;
      color: var(--vscode-descriptionForeground, #999);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
      min-height: 15px;
    }
    #now-playing.active { color: var(--vscode-foreground, #ccc); }

    .bar-label { font-size: 10px; color: var(--vscode-descriptionForeground, #666); }
    .bar-wrap {
      width: 100%; height: 4px;
      background: var(--vscode-scrollbarSlider-background, #444);
      border-radius: 2px; overflow: hidden;
    }
    .bar-fill {
      height: 100%; width: 0%;
      border-radius: 2px;
      transition: width 0.4s linear;
    }
    #audio-bar  { background: var(--vscode-progressBar-background, #0e639c); }
    #midi-bar   { background: var(--vscode-charts-green, #4caf50); transition-duration: 0.15s; }

    #time-label { font-size: 10px; color: var(--vscode-descriptionForeground, #777); text-align: right; }

    #song-select {
      width: 100%;
      background: var(--vscode-dropdown-background, #3c3c3c);
      color: var(--vscode-dropdown-foreground, #ccc);
      border: 1px solid var(--vscode-dropdown-border, #555);
      border-radius: 3px; padding: 3px 5px; font-size: 12px; cursor: pointer;
    }

    .row { display: flex; gap: 5px; }
    .btn {
      flex: 1;
      background: var(--vscode-button-secondaryBackground, #3a3a3a);
      color: var(--vscode-button-secondaryForeground, #ccc);
      border: 1px solid transparent;
      border-radius: 3px; padding: 3px 0; font-size: 13px;
      cursor: pointer; text-align: center; user-select: none;
    }
    .btn:hover { background: var(--vscode-button-secondaryHoverBackground, #505050); }
    .btn.active {
      background: var(--vscode-button-background, #0e639c);
      color: var(--vscode-button-foreground, #fff);
    }
  </style>
  <title>Akaza's Love</title>
</head>
<body>
  <div id="player">
    <div id="now-playing">—</div>
    <div class="bar-label">Demo</div>
    <div class="bar-wrap"><div class="bar-fill" id="audio-bar"></div></div>
    <div id="time-label"></div>
    <div class="bar-label">Typing</div>
    <div class="bar-wrap"><div class="bar-fill" id="midi-bar"></div></div>
    <select id="song-select"></select>
    <div class="row">
      <button class="btn" id="btn-shuffle">Shuffle</button>
      <button class="btn" id="btn-loop">Loop</button>
    </div>
  </div>

  <script>
    const vscode = acquireVsCodeApi()
    const $ = id => document.getElementById(id)

    $('song-select').addEventListener('change', () =>
      vscode.postMessage({ type: 'SELECT_SONG', idx: parseInt($('song-select').value, 10) }))

    $('btn-shuffle').addEventListener('click', () => {
      const v = !$('btn-shuffle').classList.toggle('active')
      $('btn-shuffle').classList.toggle('active', !v)
      // toggle returns the new state
      vscode.postMessage({ type: 'TOGGLE_SHUFFLE', value: $('btn-shuffle').classList.contains('active') })
    })

    $('btn-loop').addEventListener('click', () => {
      $('btn-loop').classList.toggle('active')
      vscode.postMessage({ type: 'TOGGLE_LOOP', value: $('btn-loop').classList.contains('active') })
    })

    function fmt(s) {
      if (s == null || isNaN(s)) return '--:--'
      return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`
    }

    function applySongList(msg) {
      const sel = $('song-select')
      sel.innerHTML = ''
      ;(msg.songs || []).forEach((name, i) => {
        const o = document.createElement('option')
        o.value = i; o.textContent = name; if (i === msg.currentIdx) o.selected = true
        sel.appendChild(o)
      })
      $('btn-shuffle').classList.toggle('active', !!msg.shuffle)
      $('btn-loop').classList.toggle('active', !!msg.loop)

      const name = (msg.songs || [])[msg.currentIdx] ?? null
      const np = $('now-playing')
      np.textContent = msg.isPlaying && name ? `♪ ${name}` : (name || '—')
      np.classList.toggle('active', !!(msg.isPlaying && name))

      const elapsed = msg.elapsed ?? 0, total = msg.totalDuration ?? 0
      $('audio-bar').style.width = total > 0 ? `${Math.min(100, elapsed / total * 100)}%` : '0%'
      $('time-label').textContent = total > 0 ? `${fmt(elapsed)} / ${fmt(total)}` : ''
      $('midi-bar').style.width = `${Math.min(100, (msg.midiProgress ?? 0) * 100)}%`
    }

    window.addEventListener('message', ({ data: msg }) => {
      if (!msg?.type) return
      if (msg.type === 'SONG_LIST') applySongList(msg)
    })
  </script>
</body>
</html>
