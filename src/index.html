<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <style>
    html,
    body {
      padding: 0;
      margin: 0;
      background: transparent;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: system-ui, sans-serif;
      position: relative;
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      image-rendering: -webkit-optimize-contrast;
      z-index: 1;
      background: transparent;
    }

    h2 {
      font-size: 13px;
      font-weight: 600;
      margin: 4px 0 8px;
      text-align: center;
    }

    canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    /* ── Player controls ── */
    #player {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px 8px;
      background: var(--vscode-sideBar-background, #1e1e1e);
      border-top: 1px solid var(--vscode-widget-border, #444);
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
      z-index: 10;
    }

    #song-select {
      width: 100%;
      background: var(--vscode-dropdown-background, #3c3c3c);
      color: var(--vscode-dropdown-foreground, #ccc);
      border: 1px solid var(--vscode-dropdown-border, #555);
      border-radius: 3px;
      padding: 3px 5px;
      font-size: 12px;
      cursor: pointer;
    }

    #song-select:focus {
      outline: 1px solid var(--vscode-focusBorder, #007fd4);
    }

    .player-row {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .ctrl-btn {
      flex: 1;
      background: var(--vscode-button-secondaryBackground, #3a3a3a);
      color: var(--vscode-button-secondaryForeground, #ccc);
      border: 1px solid var(--vscode-button-border, transparent);
      border-radius: 3px;
      padding: 3px 0;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s;
      user-select: none;
    }

    .ctrl-btn:hover {
      background: var(--vscode-button-secondaryHoverBackground, #505050);
    }

    .ctrl-btn.active {
      background: var(--vscode-button-background, #0e639c);
      color: var(--vscode-button-foreground, #fff);
      border-color: var(--vscode-button-background, #0e639c);
    }
  </style>
  <title>Welcome Home Hakuji</title>
</head>

<body>
  <div class="wrap">
    <img src="{{IMG_SRC}}" alt="Welcome Home Hakuji 🎆"
      style="max-width: 100%; max-height: 100%; margin: auto; display: block; position: relative; z-index: 1;" />
    <canvas id="snow"
      style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none;"></canvas>
  </div>

  <!-- Song player controls -->
  <div id="player">
    <select id="song-select" title="Select song"></select>
    <div class="player-row">
      <button class="ctrl-btn" id="btn-shuffle" title="Shuffle">🔀 Shuffle</button>
      <button class="ctrl-btn" id="btn-loop" title="Loop">🔁 Loop</button>
    </div>
  </div>

  <div id="debug-console"
    style="width: 100vw; max-height: 120px; overflow-y: auto; background: #222; color: #bcdfff; font-size: 12px; font-family: monospace; padding: 6px 10px; box-sizing: border-box; opacity: 0.85; position: relative; z-index: 10;">
  </div>
  <script>
    (function () {
      const debugDiv = document.getElementById('debug-console')
      if (!debugDiv) return
      debugDiv.style.display = 'none' // Start hidden, comment out to show
      const origLog = console.log
      const maxLines = 40
      console.log = function (...args) {
        origLog.apply(console, args)
        const msg = args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ')
        debugDiv.innerText += msg + '\n'
        // Keep only last N lines
        const lines = debugDiv.innerText.split('\n')
        if (lines.length > maxLines) debugDiv.innerText = lines.slice(-maxLines).join('\n')
        debugDiv.scrollTop = debugDiv.scrollHeight
      }
    })()
  </script>
  <script>

    window.addEventListener('error', (event) => {
      console.error('Global error:', event.error || event.message)
      // Optionally show a message in the UI or send to extension
    })

    window.addEventListener('unhandledrejection', (event) => {
      console.error('Unhandled promise rejection:', event.reason)
      // Optionally show a message in the UI or send to extension
    })

    // ── Snow canvas setup ──────────────────────────────────────────────────────
    const canvas = document.getElementById('snow')
    const ctx = canvas.getContext('2d')
    let W = 0
    let H = 0

    function resize() {
      W = canvas.width = canvas.clientWidth = window.innerWidth
      H = canvas.height = canvas.clientHeight = window.innerHeight
    }
    window.addEventListener('resize', resize)
    resize()

    let initiated = false
    let baseSpeed = 0.5
    const flakes = []
    let typingRate = 0

    // Snowflake state
    let typingDriven
    let density
    let snowColor

    function spawnFlake(override = {}) {
      // override: {speed, y}
      const v = override.speed ? override.speed : (baseSpeed + Math.random() * 1.2)
      const y = override.y ? override.y : (-10 - Math.random() * 40)
      return {
        x: Math.random() * W,               // Horizontal position (random across canvas width)
        y,                                  // Vertical position (usually above the visible area)
        r: 15 + Math.random() * 8,          // Radius (size) of the snowflake, 15-23px
        v,                                  // Vertical speed (fall speed)
        a: 0.5 + Math.random() * 0.5,       // Alpha (opacity) for gradient, 0.5-1.0
        phase: Math.random() * Math.PI * 2, // Initial phase for horizontal drift
        drift: 0.3 + Math.random() * 0.7    // Amplitude of horizontal drift (sway)
      }
    }

    function ensureFlakes() {
      // console.log('Ensuring flakes, current count:', flakes.length, 'target density:', density)
      while (flakes.length < density) flakes.push(spawnFlake())
      if (flakes.length > density) flakes.splice(density)
    }

    function tick() {
      if (!typingDriven) ensureFlakes()
      ctx.clearRect(0, 0, W, H)
      ctx.globalCompositeOperation = 'lighter'
      // Calculate boost factor based on typing rate
      let boost = 1
      if (typingDriven) {
        boost = 1 + Math.log1p(1 + typingRate) // You can tune this formula for desired effect
        // Decay typingRate toward 0 if not updated by keypress
        // slow down the boost over time - smaller === faster decay
        typingRate *= 0.5
        if (typingRate < 0.01) typingRate = 0
      }
      for (const f of flakes) {
        // Move flake down by its speed (falling), apply boost to all flakes
        f.y += f.v * boost
        // Move flake horizontally in a sine wave pattern (drifting)
        f.x += Math.sin(f.phase) * f.drift
        // Advance the phase for the next frame (controls drift oscillation)
        f.phase += 0.01 + Math.random() * 0.02

        // If flake falls below the bottom:
        if (f.y - f.r > H) {
          if (!typingDriven) {
            // In normal mode, recycle to the top at a random x
            f.y = -f.r
            f.x = Math.random() * W
          } else {
            // In typing-driven mode, mark for removal
            f._remove = true
          }
        }

        // If flake drifts off the left/right edge, wrap it to the opposite side
        if (f.x < -20) f.x = W + 20
        else if (f.x > W + 20) f.x = -20

        const colorA = `${snowColor}${0.9 * f.a})`
        const colorB = `${snowColor}0)`
        const grd = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r)
        grd.addColorStop(0, colorA)
        grd.addColorStop(1, colorB)
        ctx.fillStyle = grd
        ctx.beginPath()
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2)
        ctx.fill()
      }
      // After updating all flakes, remove those marked for removal (typing-driven mode only)
      if (typingDriven) {
        for (let i = flakes.length - 1; i >= 0; i--) {
          if (flakes[i]._remove) flakes.splice(i, 1)
        }
      }
      requestAnimationFrame(tick)
    }
    tick()

    // ── Player controls ────────────────────────────────────────────────────────
    const vscode = acquireVsCodeApi()

    const songSelect = document.getElementById('song-select')
    const btnShuffle = document.getElementById('btn-shuffle')
    const btnLoop = document.getElementById('btn-loop')
    
    // Listen for extension messages
    songSelect.addEventListener('change', () => {
      vscode.postMessage({ type: 'SELECT_SONG', idx: parseInt(songSelect.value, 10) })
    })

    btnShuffle.addEventListener('click', () => {
      const next = !btnShuffle.classList.contains('active')
      btnShuffle.classList.toggle('active', next)
      vscode.postMessage({ type: 'TOGGLE_SHUFFLE', value: next })
    })

    btnLoop.addEventListener('click', () => {
      const next = !btnLoop.classList.contains('active')
      btnLoop.classList.toggle('active', next)
      vscode.postMessage({ type: 'TOGGLE_LOOP', value: next })
    })

    function applySongList(msg) {
      // Rebuild the <select> options
      songSelect.innerHTML = ''
      ;(msg.songs || []).forEach((name, idx) => {
        const opt = document.createElement('option')
        opt.value = idx
        opt.textContent = name
        if (idx === msg.currentIdx) opt.selected = true
        songSelect.appendChild(opt)
      })

      btnShuffle.classList.toggle('active', !!msg.shuffle)
      btnLoop.classList.toggle('active', !!msg.loop)
    }

    // ── Extension message handler ──────────────────────────────────────────────
    window.addEventListener('message', event => {
      const msg = event.data
      if (!msg) { console.error('Received empty message'); return }
      if (!msg.type) { console.error('Message missing type', msg); return }

      if (msg.type === 'CONFIG') {
        initiated = true
        typingDriven = msg.typingDriven
        density = msg.density
        snowColor = msg.color
        document.body.style.background = msg.backgroundColor
        return
      }
      if (msg.type === 'SONG_LIST') {
        applySongList(msg)
        return
      }
      if (msg.type === 'KEY' && typingDriven) {
        typingRate = msg.typingRate
        // Spawn a flake per keypress, boosted based on log(1 + typingRate)
        const speed = baseSpeed + Math.log1p(1 + typingRate)
        flakes.push(spawnFlake({ speed, y: -10 }))
        if (flakes.length > density) flakes.splice(0, flakes.length - density)
        return
      }
      console.error('Should not get here, Unknown message type:', msg.type, msg)
    })
  </script>
</body>

</html>
